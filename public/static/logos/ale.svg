<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Logo ALE Combustíveis -->
  <!-- Fundo vermelho -->
  <rect width="200" height="200" fill="#E0001B"/>
  <!-- Linha branca decorativa no topo -->
  <rect x="0" y="0" width="200" height="10" fill="white" opacity="0.15"/>
  <!-- ALE branco itálico bold -->
  <text
    x="103" y="160"
    text-anchor="middle"
    font-size="114"
    font-weight="900"
    font-style="italic"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    fill="white"
    letter-spacing="-5">ALE</text>
  <!-- Linha branca decorativa inferior -->
  <rect x="15" y="174" width="170" height="5" rx="2.5" fill="white" opacity="0.4"/>
</svg>