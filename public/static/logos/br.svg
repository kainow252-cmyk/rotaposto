<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Logo BR/Petrobras Distribuidora -->
  <!-- Faixa amarela superior (26% da altura) -->
  <rect x="0" y="0" width="200" height="52" fill="#FDC813"/>
  <!-- Corpo verde -->
  <rect x="0" y="52" width="200" height="148" fill="#00824A"/>
  <!-- "BR" branco itálico bold — exatamente como a logo Petrobras Distribuidora -->
  <text
    x="103" y="172"
    text-anchor="middle"
    font-size="120"
    font-weight="900"
    font-style="italic"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    fill="white"
    letter-spacing="-5">BR</text>
</svg>