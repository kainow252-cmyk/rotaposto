<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <radialGradient id="sh" cx="36%" cy="28%" r="52%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <!-- Fundo circular laranja premium -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="96" fill="url(#sh)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Gota de combustível branca — símbolo universal de posto -->
  <path d="M100 34 C100 34 58 80 58 108 C58 131.2 77 150 100 150 C123 150 142 131.2 142 108 C142 80 100 34 100 34 Z"
        fill="white" opacity="0.95"/>
  <!-- Reflexo 3D na gota -->
  <path d="M86 56 C86 56 70 84 70 108 C70 113 72 118 75 122"
        fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="5" stroke-linecap="round"/>
  <!-- Letra P laranja dentro da gota -->
  <text x="100" y="124"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="44"
        fill="#E64A19" text-anchor="middle" dominant-baseline="middle">P</text>
</svg>
