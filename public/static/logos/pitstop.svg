<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Logo PitStop — azul marinho escuro com faixas laranja -->
  <rect width="200" height="200" fill="#0A1628"/>
  <!-- Faixa laranja superior -->
  <rect x="0" y="0" width="200" height="22" fill="#FF6200"/>
  <!-- Faixa laranja inferior -->
  <rect x="0" y="178" width="200" height="22" fill="#FF6200"/>
  <!-- Checkered flag mini no canto -->
  <rect x="4" y="26" width="9" height="9" fill="white"/>
  <rect x="13" y="26" width="9" height="9" fill="#0A1628"/>
  <rect x="4" y="35" width="9" height="9" fill="#0A1628"/>
  <rect x="13" y="35" width="9" height="9" fill="white"/>
  <rect x="22" y="26" width="9" height="9" fill="white"/>
  <rect x="22" y="35" width="9" height="9" fill="#0A1628"/>
  <!-- PIT grande branco -->
  <text x="100" y="110"
    text-anchor="middle"
    font-size="76"
    font-weight="900"
    font-family="Arial Black, Impact, Arial, sans-serif"
    fill="white"
    letter-spacing="-2">PIT</text>
  <!-- STOP em laranja -->
  <text x="100" y="165"
    text-anchor="middle"
    font-size="58"
    font-weight="900"
    font-family="Arial Black, Impact, Arial, sans-serif"
    fill="#FF6200"
    letter-spacing="2">STOP</text>
</svg>